<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=864, height=960" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "GeistMW"; src: url("assets/fonts/Geist-SemiBold.ttf"); font-weight: 600; }
      @font-face { font-family: "GeistMW"; src: url("assets/fonts/Geist-Regular.ttf"); font-weight: 400; }
      @font-face { font-family: "GeistMonoMW"; src: url("assets/fonts/GeistMono-Bold.ttf"); font-weight: 700; }
      :root { --fondo: #1a1a17; --tarjeta: #232320; --texto: #d6d1c8; --blanco: #ffffff; --oro: #c9a84c; --teal: #50b5a2; --borde: #4a4843; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 864px; height: 960px; overflow: hidden; background: var(--fondo); }
      #root { position: relative; width: 864px; height: 960px; background: var(--fondo); font-family: "GeistMW", sans-serif; color: var(--blanco); }
      #eyebrow { position: absolute; left: 48px; top: 56px; font-family: "GeistMonoMW"; font-weight: 700; font-size: 20px; letter-spacing: 0.32em; color: var(--oro); }
      #titulo { position: absolute; left: 48px; top: 96px; font-weight: 600; font-size: 56px; letter-spacing: -0.03em; }
      .bloque { position: absolute; left: 132px; width: 600px; height: 190px; background: var(--tarjeta); border: 2px solid var(--borde); border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; }
      .num { font-family: "GeistMonoMW"; font-weight: 700; font-size: 100px; letter-spacing: -0.04em; line-height: 1; }
      .lbl { font-size: 28px; color: var(--texto); margin-top: 8px; }
      .op { position: absolute; left: 0; width: 864px; text-align: center; font-family: "GeistMonoMW"; font-weight: 700; font-size: 64px; color: var(--texto); opacity: 0; }
      #fuente { position: absolute; left: 48px; top: 902px; font-family: "GeistMonoMW"; font-weight: 700; font-size: 16px; letter-spacing: 0.32em; color: var(--texto); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="864" data-height="960">
      <div id="eyebrow" class="clip" data-start="0" data-duration="25" data-track-index="0">ARCA DIGITAL #39 · TIEMPO LIBRE</div>
      <div id="titulo" class="clip" data-start="0" data-duration="25" data-track-index="0">Tu número de libertad</div>
      <div id="bq1" class="bloque clip" style="top: 210px" data-start="0" data-duration="25" data-track-index="1"><div class="num" style="color:var(--oro)">200</div><div class="lbl">salarios mensuales ahorrados</div></div>
      <div id="op1" class="op clip" style="top: 412px" data-start="0" data-duration="25" data-track-index="1">×</div>
      <div id="bq2" class="bloque clip" style="top: 490px" data-start="0" data-duration="25" data-track-index="1"><div class="num" style="color:var(--teal)">6%</div><div class="lbl">de renta</div></div>
      <div id="op2" class="op clip" style="top: 692px" data-start="0" data-duration="25" data-track-index="1">=</div>
      <div id="bq3" class="bloque clip" style="top: 770px; height: 150px" data-start="0" data-duration="25" data-track-index="1"><div class="num" style="color:var(--oro)">12</div><div class="lbl">salarios</div></div>
      <div id="fuente" class="clip" data-start="0" data-duration="25" data-track-index="0">EJEMPLO DEL AUTOR · ARCA #39</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#eyebrow", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.2);
      tl.fromTo("#titulo", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.4);
      tl.fromTo("#fuente", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.0);
      const pop = (id, t) => tl.fromTo(id, { opacity: 0, y: 24, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, t);
      pop("#bq1", 1.0);
      tl.fromTo("#op1", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 7.0);
      pop("#bq2", 7.2);
      tl.fromTo("#op2", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 8.6);
      pop("#bq3", 9.0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
